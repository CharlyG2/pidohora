# Revisión automática: corre en cada PR y en cada cambio a main.
# Si algo falla, GitHub marca el PR con una X roja y no conviene unirlo.
name: Revisión

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: la revisión solo necesita leer el código.
permissions:
  contents: read

# Si llega un cambio nuevo al mismo PR, se cancela la revisión anterior.
concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

# Las acciones externas van fijadas por su huella (SHA) y no por nombre de versión,
# para que nadie pueda cambiar su contenido sin que lo notemos. Dependabot las actualiza.
jobs:
  revision:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (app, web, core, tokens)
        run: npm run typecheck
      - name: Pruebas
        run: npm test
        env:
          TZ: America/Santiago
      - name: Compilar la web
        run: npm run build:web
      - name: Compilar la app para web (Expo)
        run: npx expo export --platform web
        working-directory: apps/mobile
        env:
          CI: 1
      # Falla si alguna librería tiene una vulnerabilidad crítica conocida.
      - run: npm audit --audit-level=critical

  base-de-datos:
    name: Base de datos — migraciones, seguridad (RLS) y reservas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Aplicar migraciones y correr las pruebas
        run: bash scripts/test-db.sh

  secretos:
    name: Seguridad — sin llaves secretas en la app ni en la web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # La llave service_role de Supabase y cualquier llave privada solo pueden vivir en el servidor.
      # Este paso revisa el código que llega al teléfono o al navegador y falla si encuentra una.
      - name: Buscar llaves secretas en el código del cliente
        run: |
          patron='service_role|sb_secret_|SUPABASE_SERVICE|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if grep -rInE "$patron" apps/mobile/src apps/mobile/App.tsx apps/mobile/index.ts apps/mobile/app.json apps/web/src packages; then
            echo "::error::Se encontró una llave secreta en código que se publica. Muévela a una Edge Function o a los secretos del servidor."
            exit 1
          fi
          echo "Sin llaves secretas en el código del cliente."
