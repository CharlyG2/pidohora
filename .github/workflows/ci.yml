# Revisión automática: corre en cada PR y en cada cambio a main.
# Si algo falla, GitHub marca el PR con una X roja y no conviene unirlo.
name: Revisión

on:
  pull_request:
  push:
    branches: [main]

jobs:
  revision:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (app, web, core, tokens)
        run: npm run typecheck
      - name: Pruebas
        run: npm test
        env:
          TZ: America/Santiago
      - name: Compilar la web
        run: npm run build:web
      - name: Compilar la app para web (Expo)
        run: npx expo export --platform web
        working-directory: apps/mobile
        env:
          CI: 1
